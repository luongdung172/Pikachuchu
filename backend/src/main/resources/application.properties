spring.application.name=pikachu-solver-backend

# Local development uses an H2 file database at backend/data/pikachuchu.mv.db.
# Production should set these environment variables to a persistent PostgreSQL database.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/pikachuchu}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
